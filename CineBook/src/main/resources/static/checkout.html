<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout & Confirm Booking — CineBook</title>
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
    <header id="site-header"></header>
    <main>
        <div class="container" style="padding-top:2rem;">
            <h1 style="font-size:1.75rem; margin-bottom:1.25rem;">Review &amp; Confirm Booking</h1>
            <div id="checkout-error" class="alert alert-error hidden"></div>

            <div class="auditorium-layout">
                <div id="checkout-details-container" class="card">
                    <p class="text-secondary">Loading booking summary...</p>
                </div>
                <aside id="checkout-price-container" class="summary-panel"></aside>
            </div>
        </div>
    </main>
    <div id="site-footer"></div>
    <script type="module">
        import { initCheckoutPage } from '/js/checkout.js';
        initCheckoutPage();
    </script>
</body>
</html>
