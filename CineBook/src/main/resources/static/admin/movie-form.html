<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add / Edit Movie — CineBook Admin</title>
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
    <header id="site-header"></header>
    <div class="admin-shell">
        <aside id="admin-sidebar" class="admin-sidebar"></aside>
        <main class="admin-main">
            <div class="section-header">
                <h1 id="movie-form-heading" style="font-size:1.75rem;">Add New Movie</h1>
                <a href="/admin/movies.html" class="btn btn-secondary btn-sm">← Back to Movies</a>
            </div>

            <div id="movie-form-error" class="alert alert-error hidden"></div>

            <form id="admin-movie-form" class="card" style="max-width:820px;">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label class="form-label" for="title">Movie Title *</label>
                        <input type="text" id="title" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="genreId">Genre *</label>
                        <select id="genreId" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="language">Language *</label>
                        <input type="text" id="language" class="form-control" value="English" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="durationMinutes">Duration (Minutes) *</label>
                        <input type="number" id="durationMinutes" class="form-control" min="30" max="600" value="135" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="releaseDate">Release Date *</label>
                        <input type="date" id="releaseDate" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="releaseStatus">Release Status *</label>
                        <select id="releaseStatus" class="form-control">
                            <option value="NOW_SHOWING">NOW_SHOWING</option>
                            <option value="COMING_SOON">COMING_SOON</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="ageRating">Age Rating</label>
                        <input type="text" id="ageRating" class="form-control" value="UA 13+" />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="director">Director</label>
                        <input type="text" id="director" class="form-control" />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="posterUrl">Poster URL *</label>
                        <input type="text" id="posterUrl" class="form-control" value="/assets/posters/movie-1.svg" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="backdropUrl">Backdrop URL</label>
                        <input type="text" id="backdropUrl" class="form-control" value="/assets/posters/backdrop-1.svg" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="castDetails">Cast Members</label>
                    <input type="text" id="castDetails" class="form-control" placeholder="Comma-separated lead actors" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="trailerUrl">Trailer URL</label>
                    <input type="url" id="trailerUrl" class="form-control" placeholder="https://www.youtube.com/watch?v=..." />
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Synopsis / Description *</label>
                    <textarea id="description" class="form-control" rows="4" required></textarea>
                </div>

                <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem;">
                    <input type="checkbox" id="active" checked />
                    <label for="active" class="form-label" style="margin:0;">Movie is Active for Public Discovery &amp; Showtime Scheduling</label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg">Save Movie</button>
            </form>
        </main>
    </div>
    <script type="module">
        import { initAdminMovieFormPage } from '/js/admin.js';
        initAdminMovieFormPage();
    </script>
</body>
</html>
