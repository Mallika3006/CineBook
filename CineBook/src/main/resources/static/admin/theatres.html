<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theatre Management — CineBook Admin</title>
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
    <header id="site-header"></header>
    <div class="admin-shell">
        <aside id="admin-sidebar" class="admin-sidebar"></aside>
        <main class="admin-main">
            <h1 style="font-size:1.75rem; margin-bottom:1.25rem;">Theatres Management</h1>
            <div id="theatre-form-error" class="alert alert-error hidden"></div>

            <div style="display:grid; grid-template-columns: 360px 1fr; gap:1.5rem; align-items:start;">
                <form id="admin-theatre-form" class="card">
                    <h3 style="margin-bottom:1rem;">Add / Edit Theatre</h3>
                    <div class="form-group">
                        <label class="form-label" for="theatre-name">Theatre Name *</label>
                        <input type="text" id="theatre-name" class="form-control" placeholder="CineBook IMAX — Indiranagar" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="theatre-city">City *</label>
                        <input type="text" id="theatre-city" class="form-control" value="Bengaluru" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="theatre-address">Full Address *</label>
                        <textarea id="theatre-address" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem;">
                        <input type="checkbox" id="theatre-active" checked />
                        <label for="theatre-active" class="form-label">Active Venue</label>
                    </div>
                    <button type="submit" id="theatre-submit-btn" class="btn btn-primary btn-block">Create Theatre</button>
                </form>

                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Theatre Name</th>
                                <th>City</th>
                                <th>Address</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="admin-theatres-tbody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script type="module">
        import { initAdminTheatresPage } from '/js/admin.js';
        initAdminTheatresPage();
    </script>
</body>
</html>
