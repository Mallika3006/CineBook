<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Your Seats — CineBook</title>
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
    <header id="site-header"></header>
    <main>
        <div class="container" style="padding-top:1.75rem;">
            <div id="seat-showtime-header" class="card" style="padding:1.15rem 1.5rem;"></div>
            <div id="seat-conflict-banner" class="alert alert-error hidden" style="margin-top:1rem;"></div>

            <div class="auditorium-layout">
                <div id="auditorium-seat-map" class="auditorium-card">
                    <p class="text-secondary" style="text-align:center;">Loading interactive auditorium seat map...</p>
                </div>
                <aside id="seat-selection-summary" class="summary-panel"></aside>
            </div>
        </div>
    </main>
    <div id="site-footer"></div>
    <script type="module">
        import { initSeatSelectionPage } from '/js/seats.js';
        initSeatSelectionPage();
    </script>
</body>
</html>
