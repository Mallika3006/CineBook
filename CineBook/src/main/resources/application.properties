# ============================================================================
# CineBook Application Configuration
# All sensitive values are injected via environment variables.
# ============================================================================
spring.application.name=CineBook
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.error.whitelabel.enabled=false

# PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinebook}
spring.datasource.username=${DB_USERNAME:cinebook_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Jackson Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Kolkata}

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.throw-exception-if-no-handler-found=true

# Actuator Health Endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# CineBook Custom Properties
cinebook.timezone=${APP_TIMEZONE:Asia/Kolkata}
cinebook.default-city=${APP_DEFAULT_CITY:Bengaluru}
cinebook.jwt.secret=${JWT_SECRET:}
cinebook.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cinebook.jwt.cookie-name=${JWT_COOKIE_NAME:cinebook_auth_token}
cinebook.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

cinebook.booking.max-seats-per-order=${BOOKING_MAX_SEATS_PER_ORDER:10}
cinebook.booking.convenience-fee-percent=${BOOKING_CONVENIENCE_FEE_PERCENT:8.50}
cinebook.booking.gst-on-fee-percent=${BOOKING_GST_ON_FEE_PERCENT:18.00}
cinebook.booking.hold-duration-seconds=${BOOKING_HOLD_DURATION_SECONDS:300}
cinebook.booking.cancellation-cutoff-minutes=${BOOKING_CANCELLATION_CUTOFF_MINUTES:60}
cinebook.showtime.turnaround-buffer-minutes=${SHOWTIME_TURNAROUND_BUFFER_MINUTES:25}

cinebook.admin.bootstrap-enabled=${CINEBOOK_ADMIN_BOOTSTRAP_ENABLED:false}
cinebook.admin.name=${CINEBOOK_ADMIN_NAME:CineBook System Admin}
cinebook.admin.email=${CINEBOOK_ADMIN_EMAIL:admin@cinebook.local}
cinebook.admin.password=${CINEBOOK_ADMIN_PASSWORD:}

cinebook.demo-customer.enabled=${CINEBOOK_DEMO_CUSTOMER_ENABLED:false}
cinebook.demo-customer.name=${CINEBOOK_DEMO_CUSTOMER_NAME:Aarav Sharma}
cinebook.demo-customer.email=${CINEBOOK_DEMO_CUSTOMER_EMAIL:customer@cinebook.local}
cinebook.demo-customer.password=${CINEBOOK_DEMO_CUSTOMER_PASSWORD:}

cinebook.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Structured Logging (never log secrets)
logging.level.root=INFO
logging.level.com.cinebook=INFO
logging.level.org.springframework.security=WARN
